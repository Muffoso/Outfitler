<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - My App</title>
  <script>
    /* Sätt sparad palett före render så inget hoppar. Se js/theme.js. */
    try {
      var p = localStorage.getItem('outfitler:palette');
      document.documentElement.dataset.palette = (p === 'bold' || p === 'muted') ? p : 'muted';
    } catch (e) {
      document.documentElement.dataset.palette = 'muted';
    }
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .banner { background: var(--accent); padding: 24px; text-align: center; }
    .banner h1 { color: var(--on-accent); font-size: 32px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; }
    .container { max-width: 400px; margin: 60px auto; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    h2 { margin-bottom: 20px; font-size: 20px; color: var(--text-strong); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; background: var(--surface-2); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    button { width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--accent-hover); }
    .error { color: var(--danger); margin-bottom: 15px; }
    .divider { margin: 20px 0; text-align: center; color: var(--text-muted); }
    .oauth-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 10px; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-weight: 500; margin-bottom: 10px; text-decoration: none; font-size: 14px; }
    .oauth-btn:hover { background: var(--surface-2); box-shadow: var(--shadow); }
    .oauth-btn svg { flex-shrink: 0; }
    .links { margin-top: 20px; text-align: center; font-size: 14px; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <button type="button" class="palette-toggle" data-palette-toggle>Palett: Dämpad</button>
  <div class="banner">
    <h1>My App</h1>
  </div>
  <div class="container">
    <h2>Log in</h2>
    <div id="error" class="error"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit">Log in</button>
    </form>

    <div class="divider">or</div>

    <a href="/auth/google" class="oauth-btn">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Sign in with Google
    </a>

    <div class="links">
      <p><a href="/register.html">Create account</a></p>
      <p><a href="/forgot-password.html">Forgot password?</a></p>
    </div>
  </div>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/login.js"></script>
</body>
</html>

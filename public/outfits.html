<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/images/favicon-32-v3.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/images/favicon-16-v3.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-v3.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-title" content="Outfitler">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Outfits – Outfitler</title>
  <script src="/js/palette-boot.js"></script>
  <script src="/js/no-zoom.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .outfit-tile { cursor: pointer; }
    .outfit-cover { position: relative; aspect-ratio: 3 / 4; overflow: hidden;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface-2); display: grid; gap: 1px; }
    .outfit-cover img { width: 100%; height: 100%; object-fit: cover; }
    .outfit-cover .cell { background: var(--surface-2); }
    .outfit-name { font-size: 13px; margin-top: 6px; color: var(--text-strong);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .section-label { font-size: 12px; color: var(--text-muted); }
    .name-input { width: 100%; font-size: 15px; font-weight: 600; }

    .og-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .og { position: relative; aspect-ratio: 3 / 4; border-radius: 6px; overflow: hidden;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; color: var(--text-muted); }
    .og img { width: 100%; height: 100%; object-fit: cover; }
    .og .rm { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
      padding: 0; line-height: 1; font-size: 15px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border); color: var(--text); cursor: pointer; }
    .picker { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      max-height: 320px; overflow-y: auto; padding: 4px;
      border: 1px solid var(--border); border-radius: 6px; }
    .picker .og { cursor: pointer; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="bar">
      <h1>Outfitler</h1>
      <nav class="nav">
        <a href="/">Garderob</a>
        <a href="/outfits.html" class="active">Outfits</a>
        <a href="/friends.html">Vänner</a>
      </nav>
      <span class="spacer"></span>
      <div data-palette-picker></div>
      <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Logga ut</button>
    </div>
  </div>

  <div id="visitBanner" class="visiting-banner" hidden>
    <div class="bar">
      <span class="vb-text"></span>
      <a class="btn btn-secondary btn-sm" href="/outfits.html">Tillbaka till mina outfits</a>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-row">
        <button type="button" id="newBtn" class="btn btn-primary btn-icon" title="Ny outfit" aria-label="Ny outfit">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7.6 3 4.8 2.3 2 5.6 4.4 8l1.2-1v5h8.8V7l1.2 1L18 5.6l-2.8-3.3L12.4 3a2.4 2.4 0 0 1-4.8 0Z"/>
            <path d="M5.6 12h8.8l-.5 9h-3l-.9-6-.9 6h-3l-.5-9Z"/>
            <path d="M19 13.5v7M15.5 17h7" stroke-width="2.4"/>
          </svg>
        </button>
        <button type="button" id="bulkBtn" class="icon-btn" title="Tagga flera" aria-label="Tagga flera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12 9 6a2 2 0 0 1 1.4-.6h1.9a2 2 0 0 1 2 2v1.9a2 2 0 0 1-.6 1.4L9 17.6a2 2 0 0 1-2.8 0L3 14.4a1.7 1.7 0 0 1 0-2.4Z" stroke-width="1.7"/>
            <circle cx="8.4" cy="8.6" r="1.2" fill="currentColor" stroke="none"/>
            <path d="M19 8v9M14.5 12.5h9" stroke-width="3"/>
          </svg>
        </button>
        <button type="button" id="filterBtn" class="icon-btn" title="Filtrera på taggar" aria-label="Filtrera på taggar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18l-7 8.2V20l-4 1.5v-8.3L3 5Z"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-row" id="tagFilter" hidden></div>
      <div class="grid-toolbar">
        <div id="sortBy"></div>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Inga outfits än. Klicka <strong>+ Ny outfit</strong>.</p>
  </div>

  <dialog id="detail"></dialog>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/outfits.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/images/favicon-32-v3.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/images/favicon-16-v3.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-v3.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-title" content="Outfitler">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Bidrag från en vän – Outfitler</title>
  <script src="/js/palette-boot.js"></script>
  <script src="/js/no-zoom.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
  <style>
    .contrib-head { font-size: 16px; color: var(--text-strong); margin-bottom: 4px; }
    .contrib-back { font-size: 13px; color: var(--accent); text-decoration: none; }
    .sug-section { margin-top: 22px; }
    .sug-section h2 { font-size: 15px; color: var(--text-strong); margin-bottom: 10px; }
    .sug-card { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .sug-card:last-child { border-bottom: none; }
    .sug-thumb { width: 72px; flex-shrink: 0; aspect-ratio: 3/4; border-radius: var(--radius);
      overflow: hidden; background: var(--surface-2); border: 1px solid var(--border);
      display: grid; gap: 1px; }
    .sug-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .sug-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .sug-title { color: var(--text-strong); font-size: 14px; }
    .sug-meta { color: var(--text-muted); font-size: 12px; }
    .sug-note { font-size: 13px; color: var(--text); white-space: pre-wrap; }
    .sug-actions { display: flex; gap: 6px; margin-top: auto; }
    .sug-empty { color: var(--text-muted); font-size: 13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="bar">
      <h1>Outfitler</h1>
      <nav class="nav">
        <a href="/">Garderob</a>
        <a href="/outfits.html">Outfits</a>
        <a href="/friends.html" class="active">Vänner</a>
      </nav>
      <span class="spacer"></span>
      <div data-palette-picker></div>
      <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Logga ut</button>
    </div>
  </div>

  <div class="wrap">
    <a class="contrib-back" href="/friends.html">← Vänner</a>
    <p class="contrib-head" id="head">Bidrag</p>

    <div class="sug-section">
      <h2>Föreslagna plagg</h2>
      <div id="sugGarments"></div>
    </div>
    <div class="sug-section">
      <h2>Föreslagna outfits</h2>
      <div id="sugOutfits"></div>
    </div>
    <div class="sug-section">
      <h2>Betyg</h2>
      <div id="ratings"></div>
    </div>
    <div class="sug-section">
      <h2>Anteckningar</h2>
      <div id="notes"></div>
    </div>
  </div>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/contributions.js"></script>
</body>
</html>

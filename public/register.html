<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/images/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-title" content="Outfitler">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Create account - My App</title>
  <script src="/js/palette-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 400px; margin: 100px auto; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    h1 { margin-bottom: 20px; font-size: 24px; color: var(--text-strong); }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: 500; }
    input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px; background: var(--surface-2); color: var(--text); }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    button { width: 100%; padding: 10px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--accent-hover); }
    .error { color: var(--danger); margin-bottom: 15px; }
    .links { margin-top: 20px; text-align: center; font-size: 14px; }
    .links a { color: var(--accent); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="palette-float"><div data-palette-picker></div></div>
  <div class="container">
    <h1>Create account</h1>
    <div id="error" class="error"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password (min 8 characters)</label>
        <input type="password" id="password" name="password" required minlength="8">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8">
      </div>
      <button type="submit">Create account</button>
    </form>

    <div class="links">
      <p>Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/register.js"></script>
</body>
</html>

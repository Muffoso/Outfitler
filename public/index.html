<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/images/favicon-32-v3.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/images/favicon-16-v3.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-v3.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-title" content="Outfitler">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Outfitler</title>
  <script src="/js/palette-boot.js"></script>
  <script src="/js/no-zoom.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="bar">
      <h1>Outfitler</h1>
      <nav class="nav">
        <a href="/" class="active">Garderob</a>
        <a href="/outfits.html">Outfits</a>
        <a href="/friends.html">Vänner</a>
      </nav>
      <span class="spacer"></span>
      <div data-palette-picker></div>
      <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Logga ut</button>
    </div>
  </div>

  <div id="visitBanner" class="visiting-banner" hidden>
    <div class="bar">
      <span class="vb-text"></span>
      <a class="btn btn-secondary btn-sm" href="/">Tillbaka till min garderob</a>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-row">
        <button type="button" id="newBtn" class="icon-btn primary" title="Nytt plagg" aria-label="Nytt plagg">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.6 4 5 3 2 6.4l2.6 2.6L6 7.9V21h8.5V7.9L16 9l2.6-2.6L15.4 3l-3 1a2.6 2.6 0 0 1-3.8 0Z"/>
            <path d="M19 13.5v7M15.5 17h7" stroke-width="2.6"/>
          </svg>
        </button>
        <button type="button" id="bulkBtn" class="icon-btn" title="Tagga flera" aria-label="Tagga flera">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18.8 12.7 12.3 19.2a2 2 0 0 1-2.8 0L2.6 12.3V4a1 1 0 0 1 1-1h8.3l6.9 6.9a2 2 0 0 1 0 2.8Z" stroke-width="1.7"/>
            <circle cx="7.6" cy="7.6" r="1.6" fill="currentColor" stroke="none"/>
            <path d="M18 15.5v6M15 18.5h6" stroke-width="3"/>
          </svg>
        </button>
        <button type="button" id="filterBtn" class="icon-btn" title="Filtrera på taggar" aria-label="Filtrera på taggar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 5h18l-7 8.2V20l-4 1.5v-8.3L3 5Z"/>
          </svg>
        </button>
      </div>
      <div class="toolbar-row" id="tagFilter" hidden></div>
      <div class="grid-toolbar">
        <label class="muted"><input type="checkbox" id="filterArchived"> Visa arkiverade</label>
        <div id="sortBy"></div>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Inga plagg än. Tryck på <strong>+</strong>-knappen för att lägga till ett.</p>
  </div>

  <dialog id="detail"></dialog>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>

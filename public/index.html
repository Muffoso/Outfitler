<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="icon" href="/images/favicon-32-v2.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/images/favicon-16-v2.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon-v2.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-title" content="Outfitler">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Outfitler</title>
  <script src="/js/palette-boot.js"></script>
  <script src="/js/no-zoom.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="topbar">
    <div class="bar">
      <h1>Outfitler</h1>
      <nav class="nav">
        <a href="/" class="active">Garderob</a>
        <a href="/outfits.html">Outfits</a>
        <a href="/friends.html">Vänner</a>
      </nav>
      <span class="spacer"></span>
      <div data-palette-picker></div>
      <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Logga ut</button>
    </div>
  </div>

  <div id="visitBanner" class="visiting-banner" hidden>
    <div class="bar">
      <span class="vb-text"></span>
      <a class="btn btn-secondary btn-sm" href="/">Tillbaka till min garderob</a>
    </div>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-row">
        <button type="button" id="newBtn" class="btn btn-primary">+ Nytt plagg</button>
        <button type="button" id="bulkBtn" class="btn btn-secondary btn-sm">Tagga flera</button>
        <span class="spacer"></span>
        <div id="sortBy"></div>
        <select id="filterRating" aria-label="Filtrera på betyg">
          <option value="">Alla betyg</option>
        </select>
        <label class="muted"><input type="checkbox" id="filterArchived"> Visa arkiverade</label>
      </div>
      <div class="toolbar-row" id="tagFilter"></div>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Inga plagg än. Klicka <strong>+ Nytt plagg</strong> för att lägga till ett.</p>
  </div>

  <dialog id="detail"></dialog>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My App</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .container { max-width: 600px; margin: 50px auto; padding: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
    h1 { margin-bottom: 20px; font-size: 28px; color: var(--text-strong); }
    .user-info { margin-bottom: 20px; padding: 10px; background: var(--surface-2); border-radius: 4px; }
    .user-info p { margin: 5px 0; }
    button { padding: 10px 20px; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-weight: 500; }
    button:hover { background: var(--border); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <div id="userInfo" class="user-info">
      <p>Loading user info...</p>
    </div>
    <button id="logoutBtn">Log out</button>
  </div>

  <script type="module" src="/js/index.js"></script>
</body>
</html>

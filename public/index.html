<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outfitler</title>
  <script src="/js/palette-boot.js"></script>
  <link rel="stylesheet" href="/css/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: var(--text); }

    .topbar { display: flex; align-items: center; gap: 12px; padding: 14px 20px;
      background: var(--surface); border-bottom: 1px solid var(--border); }
    .topbar h1 { font-size: 20px; color: var(--text-strong); letter-spacing: .5px; }
    .topbar .spacer { flex: 1; }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 20px; }

    .toolbar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; }
    .toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .toolbar-row .spacer { flex: 1; }
    .filter-label { font-size: 13px; color: var(--text-muted); }
    .filter-tags { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }

    .btn { padding: 9px 16px; border-radius: 6px; border: 1px solid transparent;
      font: inherit; font-weight: 500; cursor: pointer; }
    .btn-primary { background: var(--accent); color: var(--on-accent); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--surface-2); color: var(--text); border-color: var(--border); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: transparent; color: var(--danger); border-color: var(--border); }
    .btn-danger:hover { background: var(--surface-2); }
    .btn-sm { padding: 5px 10px; font-size: 13px; }

    select, input[type="text"], textarea {
      font: inherit; color: var(--text); background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; }
    input:focus, select:focus, textarea:focus, button:focus-visible {
      outline: 2px solid var(--accent); outline-offset: 1px; }

    /* toggle chip (filter tags + match switch) */
    .chip-toggle { font-size: 13px; white-space: nowrap; background: var(--surface-2);
      color: var(--text); border: 1px solid var(--border); border-radius: 999px;
      padding: 5px 12px; cursor: pointer; }
    .chip-toggle.on { background: var(--accent-subtle); border-color: var(--accent); color: var(--text-strong); }
    .segmented { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; }
    .segmented button { font: inherit; font-size: 13px; padding: 5px 12px; border: none;
      background: var(--surface); color: var(--text-muted); cursor: pointer; }
    .segmented button.on { background: var(--accent); color: var(--on-accent); }

    /* image-only grid, 3 per row */
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .tile { position: relative; aspect-ratio: 3 / 4; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 11px; text-align: center; padding: 8px; }
    .tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .tile.archived { opacity: .5; }
    .tile-badge { position: absolute; top: 6px; left: 6px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
      font-size: 11px; color: var(--text-strong); }

    .empty { text-align: center; color: var(--text-muted); padding: 60px 20px;
      border: 1px dashed var(--border); border-radius: var(--radius); }
    .muted { color: var(--text-muted); font-size: 13px; }

    /* detail dialog */
    dialog { border: none; padding: 0; width: 92vw; max-width: 440px; color: var(--text);
      background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
    dialog::backdrop { background: rgba(0, 0, 0, .45); }
    .detail-photo { position: relative; aspect-ratio: 3 / 4; background: var(--surface-2);
      border-bottom: 1px solid var(--border); display: flex; align-items: center;
      justify-content: center; overflow: hidden; cursor: pointer;
      color: var(--text-muted); font-size: 12px; text-align: center; padding: 12px; }
    .detail-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .detail-photo.busy { opacity: .55; pointer-events: none; }
    .detail-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .detail-head { display: flex; align-items: center; gap: 10px; }
    .detail-head .spacer { flex: 1; }

    .stars { display: flex; flex-wrap: wrap; gap: 2px; }
    .star { background: none; border: none; padding: 0 1px; cursor: pointer;
      font-size: 19px; line-height: 1; color: var(--text-muted); }
    .star.on { color: var(--text-strong); }
    .rating-clear { font-size: 12px; color: var(--text-muted); background: none;
      border: none; cursor: pointer; margin-left: 6px; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px;
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 4px 3px 10px; }
    .chip button { background: none; border: none; padding: 0; cursor: pointer;
      color: var(--text-muted); font-size: 15px; line-height: 1; }
    .chip button:hover { color: var(--danger); }
    .tag-form { display: flex; gap: 6px; }
    .tag-form input { flex: 1; font-size: 13px; padding: 6px 9px; }

    .notes { width: 100%; min-height: 60px; resize: vertical; font-size: 13px; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  </style>
</head>
<body>
  <div class="topbar">
    <h1>Outfitler</h1>
    <span class="spacer"></span>
    <div data-palette-picker></div>
    <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">Logga ut</button>
  </div>

  <div class="wrap">
    <div class="toolbar">
      <div class="toolbar-row">
        <button type="button" id="newBtn" class="btn btn-primary">+ Nytt plagg</button>
        <span class="spacer"></span>
        <select id="filterRating" aria-label="Filtrera på betyg">
          <option value="">Alla betyg</option>
        </select>
        <label class="muted"><input type="checkbox" id="filterArchived"> Visa arkiverade</label>
      </div>
      <div class="toolbar-row" id="tagFilterRow" hidden>
        <span class="filter-label">Taggar:</span>
        <div class="filter-tags" id="filterTags"></div>
        <span class="segmented" id="matchToggle" hidden>
          <button type="button" data-match="any" class="on">Någon</button>
          <button type="button" data-match="all">Alla</button>
        </span>
      </div>
    </div>

    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden>Inga plagg än. Klicka <strong>+ Nytt plagg</strong> för att lägga till ett.</p>
  </div>

  <dialog id="detail"></dialog>

  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/index.js"></script>
</body>
</html>
